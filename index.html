<!DOCTYPE html>
<html>
<head>
    <title>HTML Input Types</title>
</head>
<body>

    <h1>HTML Form - All Input Types</h1>

    <form>

        
        <label>Text:</label>
        <input type="text">
        <br><br>

        
        <label>Password:</label>
        <input type="password">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        
        <label>Number:</label>
        <input type="number">
        <br><br>

        
        <label>Telephone:</label>
        <input type="tel">
        <br><br>

        
        <label>URL:</label>
        <input type="url">
        <br><br>

       
        <label>Search:</label>
        <input type="search">
        <br><br>

        
        <label>Date:</label>
        <input type="date">
        <br><br>

        
        <label>Time:</label>
        <input type="time">
        <br><br>

        <label>Date & Time:</label>
        <input type="datetime-local">
        <br><br>

        <label>Month:</label>
        <input type="month">
        <br><br>

        
        <label>Week:</label>
        <input type="week">
        <br><br>

        
        <label>Color:</label>
        <input type="color">
        <br><br>

        
        <label>Range:</label>
        <input type="range">
        <br><br>

        <!-- Radio -->
        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <!-- Checkbox -->
        <label>Skills:</label>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> Python
        <br><br>

        <!-- File -->
        <label>Upload File:</label>
        <input type="file">
        <br><br>

        <!-- Hidden -->
        <input type="hidden" value="123">

        <!-- Submit -->
        <input type="submit" value="Submit">

        <!-- Reset -->
        <input type="reset" value="Reset">

        <!-- Button -->
        <input type="button" value="Click Me">

    </form>

</body>
</html>
